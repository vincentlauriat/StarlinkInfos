name: StarlinkInfos
options:
  bundleIdPrefix: com.example
  # macOS 15 / iOS 18 minimum : exigence de grpc-swift-2 (client gRPC de l'antenne).
  deploymentTarget:
    macOS: "15.0"
    iOS: "18.0"

# Client gRPC de l'API locale de l'antenne Starlink (192.168.100.1:9200).
# Le code Swift des messages/du service est généré depuis Proto/dish.protoset
# (voir ARCHITECTURE.md) dans StarlinkInfos/Generated/.
packages:
  GRPCSwift:
    url: https://github.com/grpc/grpc-swift-2
    from: 2.4.2
  GRPCNIOTransport:
    url: https://github.com/grpc/grpc-swift-nio-transport
    from: 2.9.0
  GRPCProtobufPkg:
    url: https://github.com/grpc/grpc-swift-protobuf
    from: 2.4.1
  SwiftProtobuf:
    url: https://github.com/apple/swift-protobuf
    from: 1.38.1
  # Auto-update (macOS only — App Store/TestFlight would handle this on iOS).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.9.1

# Schemes explicites (sinon xcodegen n'en génère pas → schemes perdus à chaque régénération).
schemes:
  StarlinkInfos:
    build:
      targets:
        StarlinkInfos: all
    run:
      config: Debug
  StarlinkInfosiOS:
    build:
      targets:
        StarlinkInfosiOS: all
    run:
      config: Debug

targets:
  # ---------------------------------------------------------------------------
  # macOS
  # ---------------------------------------------------------------------------
  StarlinkInfos:
    type: application
    platform: macOS
    deploymentTarget: "15.0"
    dependencies:
      - package: GRPCSwift
        product: GRPCCore
      - package: GRPCNIOTransport
        product: GRPCNIOTransportHTTP2
      - package: GRPCProtobufPkg
        product: GRPCProtobuf
      - package: SwiftProtobuf
        product: SwiftProtobuf
      - package: Sparkle
    sources:
      - path: StarlinkInfos
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Info-iOS.plist"
    settings:
      base:
        PRODUCT_NAME: StarlinkInfos
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.starlinkinfos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        CODE_SIGN_ENTITLEMENTS: StarlinkInfos/StarlinkInfos.entitlements
        CODE_SIGN_IDENTITY: ""
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
    info:
      path: StarlinkInfos/Info.plist
      properties:
        CFBundleName: StarlinkInfos
        CFBundleDisplayName: StarlinkInfos
        CFBundleIdentifier: fr.vincentlauriat.starlinkinfos
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSMinimumSystemVersion: "15.0"
        NSHumanReadableCopyright: ""
        # Sparkle auto-update. Public half of the EdDSA key generated in the
        # login keychain under account "StarlinkInfos" — NEVER regenerate this
        # key (see Scripts/release.sh header).
        SUFeedURL: "https://raw.githubusercontent.com/vincentlauriat/StarlinkInfos/master/appcast.xml"
        SUPublicEDKey: "dfikprsOcAmXXkLq821pg7SpSbr73EIHsSIOTyYeYj8="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false

  # ---------------------------------------------------------------------------
  # iOS / iPadOS — codebase partagé avec la cible macOS
  # ---------------------------------------------------------------------------
  StarlinkInfosiOS:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    dependencies:
      - package: GRPCSwift
        product: GRPCCore
      - package: GRPCNIOTransport
        product: GRPCNIOTransportHTTP2
      - package: GRPCProtobufPkg
        product: GRPCProtobuf
      - package: SwiftProtobuf
        product: SwiftProtobuf
    sources:
      - path: StarlinkInfos
        excludes:
          - "**/*.entitlements"
          - "Info.plist"
          - "Info-iOS.plist"
    settings:
      base:
        PRODUCT_NAME: StarlinkInfos
        PRODUCT_BUNDLE_IDENTIFIER: fr.vincentlauriat.starlinkinfos
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.9"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        TARGETED_DEVICE_FAMILY: "1,2"
        # Signature automatique gérée dans Xcode (ton Apple ID).
        # Le build de vérification simulateur passe CODE_SIGNING_ALLOWED=NO en argument.
        CODE_SIGN_STYLE: Automatic
    info:
      path: StarlinkInfos/Info-iOS.plist
      properties:
        CFBundleName: StarlinkInfos
        CFBundleDisplayName: StarlinkInfos
        CFBundleIdentifier: fr.vincentlauriat.starlinkinfos
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSLocalNetworkUsageDescription: "StarlinkInfos communique avec votre antenne Starlink (192.168.100.1) sur le réseau local pour afficher l'état de la connexion."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
